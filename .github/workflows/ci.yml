name: Validate Farstar Nexa
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexa_test
          POSTGRES_PASSWORD: ci-disposable-database
          POSTGRES_DB: nexa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexa_test -d nexa_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://nexa_test:ci-disposable-database@localhost:5432/nexa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock -e './backend[dev]'
      - run: ruff check backend cli scripts tests
      - run: ruff format --check backend cli scripts tests
      - run: pytest tests -q
      - run: bash -n installer.sh scripts/ci-stack.sh
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci-stack.sh
      - if: failure()
        run: docker compose logs --tail 80
      - if: always()
        run: docker compose down --remove-orphans || true
