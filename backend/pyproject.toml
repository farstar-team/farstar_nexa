[project]
name = "farstar-nexa"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.53.0", "sqlalchemy==2.0.54",
  "alembic==1.20.0", "psycopg[binary]==3.3.6", "redis==8.1.0",
  "pydantic-settings==2.15.0", "argon2-cffi==25.1.0", "cryptography==50.0.1",
  "httpx==0.28.1", "psutil==7.2.2", "email-validator==2.3.0"
]
[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.8"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["nexa*"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.pytest.ini_options]
testpaths = ["../tests"]
